<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFD23F" />
    <title>Offline · StudyOS</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f4f4ee;
        --ink: #111111;
        --yellow: #ffd23f;
        --line: #111111;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #121211;
          --ink: #f4f4ee;
          --line: #3a3a36;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Work Sans", system-ui, sans-serif;
        background: var(--canvas);
        color: var(--ink);
      }
      main {
        max-width: 22rem;
        border: 2px solid var(--line);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 3px 3px 0 #111111;
        background: var(--canvas);
      }
      h1 {
        margin: 0;
        font-family: "Archivo Black", Impact, sans-serif;
        font-size: 2rem;
        font-weight: 400;
        line-height: 1.1;
      }
      p { margin: 0.75rem 0 0; line-height: 1.45; opacity: 0.85; }
      a {
        display: inline-flex;
        margin-top: 1.25rem;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0 1.25rem;
        border: 2px solid #111111;
        border-radius: 14px;
        background: var(--yellow);
        color: #111111;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>StudyOS needs a connection for roadmap data, quizzes, and AI. Reconnect, then open the app again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
